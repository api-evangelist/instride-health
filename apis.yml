name: Instride Health
description: InStride Health is a virtual mental health provider delivering specialized, insurance-based
  treatment for children, teens, and young adults ages 7 to 24 who struggle with anxiety, OCD, panic,
  phobias, school avoidance, and related disorders. Its structured four-to-eight month program pairs each
  patient with a coordinated care team of a therapist, a psychiatric prescriber, and an exposure coach,
  combining evidence-based cognitive behavioral therapy and exposure-and-response prevention delivered
  over telehealth. The company is backed by General Catalyst and tracked in the API Evangelist network;
  it operates as a clinical care provider and publishes no public API, developer program, or SDK.
